<main class="min-h-screen bg-slate-100 px-4 py-8 sm:px-6">
  <div class="mx-auto w-full max-w-3xl">
    <a routerLink="/users" class="mb-5 inline-flex text-sm font-semibold text-blue-700 hover:text-blue-900">
      Back to users
    </a>

    <div class="overflow-hidden rounded-2xl bg-white shadow-xl">
      <div class="p-4 sm:p-8">
        <div class="mb-6 flex items-start justify-between gap-4">
          <div>
            <h2 id="create-user-title" class="text-2xl font-bold text-slate-900">
              Create user
            </h2>

            <p class="mt-1 text-sm text-slate-500">
              Enter the information for the new user.
            </p>
          </div>

          <button type="button" aria-label="Close" [disabled]="isSubmitting()" (click)="cancel()"
            class="rounded-lg px-3 py-2 text-xl text-slate-500 hover:bg-slate-100 disabled:opacity-50">
          </button>
        </div>

        @if (errorMessage()) {
        <div class="mb-5 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm font-semibold text-red-700">
          {{ errorMessage() }}
        </div>
        }

        <form [formGroup]="userForm" (ngSubmit)="submitForm()" class="space-y-5">
          <div class="grid grid-cols-1 gap-5 sm:grid-cols-2">
            <label class="block min-w-0">
              <span class="mb-1 block text-sm font-semibold text-slate-700">
                First name
              </span>

              <input type="text" formControlName="first_name"
                class="w-full rounded-lg border border-slate-300 px-3 py-2 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100" />
            </label>

            <label class="block min-w-0">
              <span class="mb-1 block text-sm font-semibold text-slate-700">
                Middle name
              </span>

              <input type="text" formControlName="middle_name"
                class="w-full rounded-lg border border-slate-300 px-3 py-2 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100" />
            </label>

            <label class="block min-w-0">
              <span class="mb-1 block text-sm font-semibold text-slate-700">
                Last name
              </span>

              <input type="text" formControlName="last_name"
                class="w-full rounded-lg border border-slate-300 px-3 py-2 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100" />
            </label>

            <label class="block min-w-0">
              <span class="mb-1 block text-sm font-semibold text-slate-700">
                Gender
              </span>

              <select formControlName="gender"
                class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100">
                <option value="">Select gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
              </select>
            </label>

            <label class="block min-w-0">
              <span class="mb-1 block text-sm font-semibold text-slate-700">
                Date of birth
              </span>

              <input type="date" formControlName="dob"
                class="w-full rounded-lg border border-slate-300 px-3 py-2 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100" />
            </label>

            <label class="block min-w-0">
              <span class="mb-1 block text-sm font-semibold text-slate-700">
                Email
              </span>

              <input type="email" formControlName="email"
                class="w-full rounded-lg border border-slate-300 px-3 py-2 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100" />
            </label>
          </div>

          <label class="block min-w-0">
            <span class="mb-1 block text-sm font-semibold text-slate-700">
              Password
            </span>

            <input type="password" formControlName="password" autocomplete="new-password"
              class="w-full rounded-lg border border-slate-300 px-3 py-2 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100" />
          </label>

          <div class="flex flex-col-reverse gap-3 border-t border-slate-200 pt-5 sm:flex-row sm:justify-end">
            <button type="button" [disabled]="isSubmitting()" (click)="cancel()"
              class="w-full rounded-lg border border-slate-300 px-5 py-2.5 font-semibold text-slate-700 hover:bg-slate-50 disabled:opacity-50 sm:w-auto">
              Cancel
            </button>

            <button type="submit" [disabled]="isSubmitting()"
              class="w-full rounded-lg bg-indigo-600 px-5 py-2.5 font-semibold text-white hover:bg-indigo-700 disabled:bg-indigo-300 sm:w-auto">
              {{ isSubmitting() ? 'Creating...' : 'Create user' }}
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</main>
