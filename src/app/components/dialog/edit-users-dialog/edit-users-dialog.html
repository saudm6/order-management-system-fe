<div
  class="fixed inset-0 z-[9999] overflow-y-auto bg-slate-950/60"
  role="dialog"
  aria-modal="true"
  aria-labelledby="edit-user-title"
  (click)="cancelled.emit()"
>
  <div class="flex min-h-full items-start justify-center p-3 sm:items-center sm:p-6">
    <div
      class="my-3 w-full min-w-0 max-w-2xl overflow-hidden rounded-xl bg-white shadow-2xl sm:my-0 sm:rounded-2xl"
      (click)="$event.stopPropagation()"
    >
      <app-user-details-page
        [user]="user()"
        [isSubmitting]="isSubmitting()"
        (submitted)="updated.emit($event)"
        (cancelled)="cancelled.emit()"
      />
    </div>
  </div>
</div>
