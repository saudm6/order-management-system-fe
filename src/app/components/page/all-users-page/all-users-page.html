<main class="min-h-screen bg-slate-50 px-6 py-10">
  <div class="mx-auto max-w-5xl">
  <h1 class="mb-6 text-3xl font-bold text-slate-800">Users</h1>

  @if (isLoading()) {
    <p class="text-sm font-medium text-indigo-600">Loading users...</p>
  } @else {
    <div class="overflow-x-auto rounded-xl border border-slate-200 bg-white shadow-lg shadow-slate-200/60">
      <table class="min-w-full divide-y divide-slate-200">
        <thead class="bg-indigo-600">
          <tr>
            <th class="px-6 py-4 text-left text-xs font-semibold uppercase tracking-wider text-white">UUID</th>
            <th class="px-6 py-4 text-left text-xs font-semibold uppercase tracking-wider text-white">Name</th>
            <th class="px-6 py-4 text-left text-xs font-semibold uppercase tracking-wider text-white">Gender</th>
            <th class="px-6 py-4 text-left text-xs font-semibold uppercase tracking-wider text-white">Date of Birth</th>

            <th class="px-6 py-4 text-left text-xs font-semibold uppercase tracking-wider text-white">Email</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-100">
          @for (user of users(); track user.id) {
            <td class="whitespace-nowrap px-6 py-4 text-sm font-semibold text-slate-800">{{ user.id }}</td>
            <tr class="transition-colors odd:bg-white even:bg-indigo-50/40 hover:bg-indigo-50">
              <td class="whitespace-nowrap px-6 py-4 text-sm font-semibold text-slate-800">
                {{ user.first_name }} {{ user.middle_name }} {{ user.last_name  }}
              </td>
              <td class="whitespace-nowrap px-6 py-4 text-sm font-semibold text-slate-800">{{ user.gender }}</td>
              <td class="whitespace-nowrap px-6 py-4 text-sm font-semibold text-slate-800">{{ user.dob }}</td>
              <td class="whitespace-nowrap px-6 py-4 text-sm text-indigo-700">{{ user.email }}</td>
            </tr>
          } @empty {
            <tr>
              <td colspan="2" class="px-6 py-10 text-center text-sm text-slate-500">No users found.</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  }
  </div>
</main>
