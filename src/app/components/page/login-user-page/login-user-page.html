<main class="login-page">
  <div class="page-container">
    <section class="login-card">
      <header class="card-header">
        <div class="header-icon" aria-hidden="true">
          <span></span>
        </div>

        <div>
          <h1 class="page-title">Welcome back</h1>
          <p class="page-description">
            Enter your email address and password to access your account.
          </p>
        </div>
      </header>

      @if (errorMessage()) {
        <div class="error-banner" role="alert">
          <span class="error-icon" aria-hidden="true">!</span>
          <span>{{ errorMessage() }}</span>
        </div>
      }

      <form
        class="login-form"
        [formGroup]="userForm()"
        (ngSubmit)="submitted.emit()"
      >
        <div class="form-content">
          <label class="form-field">
            <span class="field-label">Email address</span>

            <input
              type="email"
              formControlName="email"
              placeholder="name@example.com"
              autocomplete="email"
            />

            @if (
              userForm().get('email')?.touched &&
              userForm().get('email')?.hasError('required')
            ) {
              <span class="field-error">
                Email address is required.
              </span>
            } @else if (
              userForm().get('email')?.touched &&
              userForm().get('email')?.hasError('email')
            ) {
              <span class="field-error">
                Enter a valid email address.
              </span>
            }
          </label>

          <label class="form-field">
            <span class="field-label">Password</span>

            <input
              type="password"
              formControlName="password"
              placeholder="Enter your password"
              autocomplete="current-password"
            />

            @if (
              userForm().get('password')?.touched &&
              userForm().get('password')?.hasError('required')
            ) {
              <span class="field-error">
                Password is required.
              </span>
            } @else if (
              userForm().get('password')?.touched &&
              userForm().get('password')?.hasError('minlength')
            ) {
              <span class="field-error">
                Password must contain at least 8 characters.
              </span>
            }
          </label>
        </div>

        <footer class="form-actions">
          <button
            class="button button-secondary"
            type="button"
            [disabled]="isSubmitting()"
            (click)="cancelled.emit()"
          >
            Cancel
          </button>

          <button
            class="button button-primary"
            type="submit"
            [disabled]="isSubmitting()"
          >
            @if (isSubmitting()) {
              <span class="button-spinner" aria-hidden="true"></span>
              Signing in...
            } @else {
              Sign in
            }
          </button>
        </footer>
      </form>
    </section>

    <p class="security-message">
      Your account information is transmitted securely.
    </p>
  </div>
</main>
